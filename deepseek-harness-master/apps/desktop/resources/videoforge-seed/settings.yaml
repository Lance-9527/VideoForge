llm-pi-ai:
  providers:
    minimax-cn:
      apiKeyEnv: MINIMAX_CN_API_KEY
      models:
      - id: MiniMax-M2.7
      - id: MiniMax-M2.7-highspeed
      - id: MiniMax-M3
      - id: MiniMax-M3.1-Flash
        name: MiniMax-M3.1-Flash
        contextWindow: 1000000
        maxTokens: 128000
        input:
        - text
        - image
        reasoningEfforts:
          low: low
          medium: medium
          high: high
          xhigh: xhigh
          max: max
        compat:
          forceAdaptiveThinking: true
    agentai:
      displayName: agentai 中转站（OpenAI 兼容）
      api: openai-completions
      baseURL: https://agentai.token6688.com/v1
      apiKeyEnv: AGENTAI_API_KEY
      defaultInput:
      - text
      - image
      defaultContextWindow: 262144
      defaultMaxTokens: 32768
      models:
      - id: claude-sonnet-5
        name: Claude Sonnet 5
        input:
        - text
        - image
      - id: claude-opus-5
        name: Claude Opus 5
        input:
        - text
        - image
      - id: gpt-5.5
        name: GPT-5.5
        input:
        - text
        - image
      - id: gemini-3-pro
        name: Gemini 3 Pro
        input:
        - text
        - image
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro
        input:
        - text
      - id: deepseek-v4.1-flash
        name: DeepSeek V4.1 Flash
        input:
        - text
      - id: qwen3.8-max
        name: Qwen3.8 Max
        input:
        - text
        - image
      - id: glm-5.3
        name: GLM-5.3
        input:
        - text
      - id: kimi-k3
        name: Kimi K3
        input:
        - text
      - id: minimax-m3
        name: MiniMax M3
        input:
        - text
        - image
      - id: doubao-seed-2-0-pro
        name: Doubao Seed 2.0 Pro
        input:
        - text
        - image
ui-theme:
  preference: dark
ui-chat:
  transcriptView: verbose
  collapseTiming: next-input
